[build-system]
requires = ["poetry-core>=1.5.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "simeval-ir"
version = "0.1.0"
description = "A unified toolkit and benchmark suite for evaluating user simulators and search sessions"
authors = ["Saber Zerhoudi <szerhoudi@acm.org>"]
license = "MIT"
readme = "README.md"
homepage = "https://github.com/searchsim-org/sigir26-simeval-ir"
repository = "https://github.com/searchsim-org/sigir26-simeval-ir"
documentation = "https://github.com/searchsim-org/sigir26-simeval-ir#readme"
keywords = [
    "information-retrieval",
    "evaluation",
    "user-simulation",
    "session-search",
    "conversational-ir",
    "benchmark",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Information Analysis",
]
packages = [{include = "simeval_ir", from = "src"}]
include = [
    "README.md",
    "LICENSE",
]

[tool.poetry.urls]
"Bug Tracker" = "https://github.com/searchsim-org/sigir26-simeval-ir/issues"
"Source"      = "https://github.com/searchsim-org/sigir26-simeval-ir"

[tool.poetry.dependencies]
python = ">=3.9,<4.0"
pydantic = ">=2.0,<3.0"
numpy = ">=1.24"
scipy = ">=1.10"
scikit-learn = ">=1.3"
click = ">=8.1"
rich = ">=13.0"
pyyaml = ">=6.0"

[tool.poetry.group.dev.dependencies]
pytest = ">=7.4"
pytest-cov = ">=4.1"
black = ">=23.0"
ruff = ">=0.1"
mypy = ">=1.5"

[tool.poetry.group.ml]
optional = true

[tool.poetry.group.ml.dependencies]
torch = ">=2.0"
transformers = ">=4.30"
sentence-transformers = ">=2.2"

[tool.poetry.group.llm]
optional = true

[tool.poetry.group.llm.dependencies]
openai = ">=1.0"

[tool.poetry.group.figures]
optional = true

[tool.poetry.group.figures.dependencies]
matplotlib = ">=3.7"

[tool.poetry.group.datasets]
optional = true

[tool.poetry.group.datasets.dependencies]
ir-datasets = ">=0.5"

[tool.poetry.group.pyterrier]
optional = true

[tool.poetry.group.pyterrier.dependencies]
python-terrier = ">=0.10"
pandas = ">=2.0"

[tool.poetry.scripts]
simeval = "simeval_ir.cli:main"

[tool.black]
line-length = 100
target-version = ["py39", "py310", "py311", "py312"]

[tool.ruff]
line-length = 100
target-version = "py39"

[tool.ruff.lint]
select = ["E", "F", "I", "N", "W", "UP"]
ignore = ["F401"]  # allow re-exported names in __init__ files

[tool.mypy]
python_version = "3.9"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts  = "-q"
