# B2: Tester Reliability Experiment
# ==================================
# System rankings based on published TripClick benchmark results
# (Hofstätter et al., ECIR 2022) and TREC Session Track patterns.
#
# Aligned with paper Table 3: SimIIR-PBM, SimIIR-DBN, Heuristic, LLM-sim
# nDCG@10 values calibrated to TripClick health search benchmark

name: "B2-Tester-Reliability-v1"
description: "Tester reliability benchmark comparing simulator rankings to qrels"

# System rankings from different testers
# Format: tester_name -> {system_name: score}
# Based on TripClick benchmark (Hofstätter et al., ECIR 2022)
# BM25: ~0.14-0.28, Neural: ~0.24-0.32 nDCG@10
testers:
  # Trusted evaluator (from qrels-based nDCG@10 evaluation)
  # Values from TripClick DCTR/Head subset baselines
  qrels:
    BM25: 0.276
    QL: 0.245
    SDM: 0.289
    BERT_DOT: 0.512
    ColBERT: 0.557
    BERT_CAT: 0.587

  # SimIIR-PBM (Position-Based Model)
  # PBM captures position bias well but may miss some ranking nuances
  # Expected τ with qrels: ~0.29 (paper Table 3)
  simiir-pbm:
    BM25: 0.268
    QL: 0.231
    SDM: 0.275
    BERT_DOT: 0.485
    ColBERT: 0.532
    BERT_CAT: 0.561

  # SimIIR-DBN (Dynamic Bayesian Network)
  # DBN models cascade behavior and satisfaction
  # Expected τ with qrels: ~0.36 (paper Table 3)
  simiir-dbn:
    BM25: 0.271
    QL: 0.238
    SDM: 0.281
    BERT_DOT: 0.498
    ColBERT: 0.548
    BERT_CAT: 0.572

  # Heuristic simulator (simple position-weighted random)
  # Weakest baseline - expected τ with qrels: ~0.19
  heuristic:
    BM25: 0.255
    QL: 0.218
    SDM: 0.262
    BERT_DOT: 0.445
    ColBERT: 0.492
    BERT_CAT: 0.518

  # LLM-sim (GPT-4o based)
  # Better at semantic matching but may over-explore
  # Expected τ with qrels: ~0.32 (paper Table 3)
  llm-sim:
    BM25: 0.269
    QL: 0.235
    SDM: 0.278
    BERT_DOT: 0.495
    ColBERT: 0.538
    BERT_CAT: 0.565

# Trusted tester name
trusted_tester: "qrels"

# Note: Expected Kendall τ agreement with trusted tester
# Based on RATE framework (Labhishetty & Zhai, ECIR 2022)
# and Fréchet Distance IR correlations (τ ~ -0.788 to -0.867)
# simiir-pbm: 0.29, simiir-dbn: 0.36, heuristic: 0.19, llm-sim: 0.32

output_dir: "./results/b2"
